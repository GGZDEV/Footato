<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Footato — Mercatos</title>
    <meta name="description" content="Achats, ventes et bilan de chaque mercato depuis 1992 — neuf championnats européens et la Saudi Pro League. Filtrez par championnat, club, saison et fenêtre de transfert." />
    <meta name="theme-color" content="#071319" />
    <script>
      (() => {
        try {
          const saved = localStorage.getItem('footato-theme');
          document.documentElement.dataset.theme = saved === 'light' ? 'light' : 'dark';
        } catch {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
    <link rel="icon" href="%BASE_URL%favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

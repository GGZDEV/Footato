name: Déployer sur GitHub Pages

on:
  push:
    branches: [main, 'claude/**', 'codex/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The scheduled collect workflow owns the Transfermarkt refresh. Historical
      # imports are fetched here because data/raw/ is ignored by Git; the current
      # season comes from the versioned collection.
      - name: Vérifier les données et le code
        run: |
          npm run data:fetch
          npm run data:recent
          npm run data:build
          npm run collector:verify
          npm run freshness:validate
          npm run freshness:verify
          npm run analytics:verify
          npm run finance:validate
      - name: Construire le site
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
